<!doctype html>
<!-- Throwaway: three daily-task layouts on one route (?variant=A|B|C). In-memory synthetic data only. -->
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸序 · 一天的任务 · 决策原型</title>
<link rel="icon" href="data:,">
<style>
:root{--paper:#faf7f0;--panel:#fffdf8;--ink:#303c34;--muted:#61695e;--line:#dfdfd2;--green:#365d46;--soft:#e7eddf;--warm:#eee3ce;--amber:#775216;--danger:#91483d;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button,a,input,textarea{touch-action:manipulation}button{cursor:pointer;color:inherit;background:transparent;border:1px solid transparent;min-height:44px;border-radius:7px;padding:8px 13px}button:hover{background:var(--soft)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #9b6c2e;outline-offset:3px}button:disabled{cursor:default;opacity:.55}a{color:var(--green)}h1,h2,h3,p{margin-top:0}h1{font-weight:550;letter-spacing:-1px;font-size:36px;line-height:1.25;margin-bottom:10px}h2{font-size:19px;font-weight:600}small,.muted{color:var(--muted)}.serif{font-family:"Noto Serif SC","SimSun",serif}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}.primary{background:var(--green);color:white}.primary:hover{background:#284934}.outline{border-color:var(--line)}.skip{position:absolute;left:12px;top:-60px;background:white;z-index:10;padding:8px}.skip:focus{top:12px}
.lab{padding:9px 24px;background:#e9e9de;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}.lab strong{font-weight:650}.lab span{color:#535b50}.lab button{min-height:32px;padding:3px 10px;font-size:12px}.lab .spacer{flex:1}.brand{display:flex;align-items:center;gap:9px}.brand-icon{width:44px;height:42px;background:url('../../assets/brand-concept.png') -79px -148px / 280.5px 350.5px no-repeat;flex-shrink:0;border-radius:5px}.brand strong{font-family:SimSun,serif;font-size:25px;letter-spacing:3px}.brand small{font-size:10px;letter-spacing:2px;display:block;line-height:1.1}.app{padding-bottom:140px;min-height:calc(100vh - 52px)}.nav-button{display:flex;width:100%;text-align:left;justify-content:space-between;gap:12px}.nav-button.active{background:var(--soft);color:var(--green);font-weight:600}.sidebar{background:#f0f0e5;padding:28px 20px;border-right:1px solid var(--line)}.sidebar .brand{margin:3px 0 38px}.sidebar .group{margin:28px 12px 8px;font-size:12px;color:var(--muted)}.sidebar .foot{margin-top:65px;font-size:12px;color:var(--muted)}.count{font-size:12px}.workspace{min-width:0;padding:40px 36px}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.date{margin-bottom:10px;font-size:13px;color:var(--muted)}.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--green);padding:5px 9px;border:1px solid var(--line);border-radius:20px}.status.offline{color:var(--amber);background:#f4ead5}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.entry{display:flex;gap:8px;border:1px solid #c6ccbd;background:var(--panel);padding:7px;border-radius:8px;margin:20px 0 24px}.entry label{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden}.entry input{width:100%;min-width:0;padding:7px;border:0;background:transparent;color:var(--ink)}.entry .primary{white-space:nowrap}.list-heading{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;font-size:12px;letter-spacing:1px;margin:26px 0 0}.task{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:76px;gap:2px}.task.selected{background:#eaf0e4}.check{font-size:18px;flex:0 0 44px;padding:10px}.circle{display:block;width:19px;height:19px;border:1.5px solid #828e7d;border-radius:50%;line-height:16px;font-size:13px;color:white;margin:auto}.done .circle{background:var(--green);border-color:var(--green)}.task-open{flex:1;min-width:0;text-align:left;padding:12px 8px;display:block;border-radius:0}.task-title{display:block;overflow-wrap:anywhere}.task-meta{font-size:12px;color:var(--muted);display:flex;gap:9px;margin-top:4px}.done .task-title{text-decoration:line-through;color:var(--muted)}.time{font-size:12px;color:var(--green);padding-right:12px;white-space:nowrap}.detail{padding:36px 26px;background:var(--panel);border-left:1px solid var(--line);min-width:0}.detail h2{font-size:24px;line-height:1.5;margin:25px 0}.detail .label{font-size:12px;color:var(--muted);margin-bottom:5px}.detail dl{font-size:13px;display:grid;grid-template-columns:65px 1fr;gap:17px 8px;margin:24px 0}.detail dt{color:var(--muted)}.detail dd{margin:0}.detail textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:7px;padding:12px;background:transparent;resize:vertical;color:var(--ink)}.detail label{display:block;margin:22px 0 8px;font-size:13px}.detail .save{margin-top:10px}.detail .close-detail{float:right;font-size:12px}.empty{padding:40px 12px;color:var(--muted)}.A{display:grid;grid-template-columns:208px minmax(340px,1fr) 300px}.A .workspace{max-width:1000px}
.B{max-width:1120px;margin:auto;padding:30px 36px 150px}.B .topbar,.C .topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs .active{background:var(--soft)}.B .notebook{max-width:760px;margin:42px auto;background:var(--panel);padding:40px 52px;border:1px solid var(--line);box-shadow:0 12px 40px #39452b06}.B h1{font-family:SimSun,serif;font-size:40px}.B .detail{border:0;border-top:1px solid var(--line);margin-top:30px;padding:15px 0}.B .task{min-height:84px}.B .quote{color:var(--muted);font-family:SimSun,serif;font-size:16px;margin:20px 0 30px}.C{padding:28px 40px 150px;max-width:1500px;margin:auto}.C .heading{margin-top:30px}.C .day-grid{display:grid;grid-template-columns:minmax(300px,1.3fr) minmax(280px,1fr) 280px;gap:28px}.C .timeline{background:var(--panel);padding:12px 24px;border:1px solid var(--line);border-radius:8px}.C .slot{display:grid;grid-template-columns:50px 1fr;border-top:1px solid var(--line);padding:19px 0;min-height:115px;gap:10px}.C .slot-time{font-size:12px;color:var(--muted);padding-top:12px}.C .slot .task{border:0;align-self:start;background:var(--soft);border-radius:5px;min-height:72px}.C .slot .time{display:none}.C .detail{padding:0 0 0 22px}.C .entry{margin-top:0}.C .timeline h2{margin:10px 0 20px}.C .untimed h2{margin:8px 0 18px}.C .slot .empty-slot{font-size:12px;color:var(--muted);padding-top:12px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);width:460px;background:#2d3b31;color:white;border:1px solid #647363;border-radius:15px;padding:8px 12px;box-shadow:0 7px 25px #26392a25;z-index:4}.switcher .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.switcher button{color:white}.switcher button:hover{background:#455647}.switcher small{color:#d5dfce;font-size:11px;display:block;text-align:center}.switcher strong{font-size:14px}.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);padding:9px 16px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 3px 15px #0001;z-index:5;max-width:90%;font-size:13px}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:12px;padding:25px;max-width:min(700px,90vw);max-height:85vh;color:var(--ink);background:var(--panel)}dialog::backdrop{background:#22322677}dialog img{width:100%;height:auto}dialog button{float:right}.hint{font-size:12px;color:var(--muted);margin-top:20px}.mobile-brand{display:none}
.brand-icon{height:32px;background-position:-79px -151px}
@media(min-width:1550px){.A{grid-template-columns:230px minmax(340px,1fr) 350px}.A .workspace{padding:50px 70px}}
@media(max-width:1100px){.A{grid-template-columns:180px minmax(290px,1fr)}.A .detail{grid-column:2;border-top:1px solid var(--line);border-left:0}.A .sidebar{grid-row:1/3}.C .day-grid{grid-template-columns:1fr 1fr}.C .detail{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:20px 0}.workspace{padding:30px 25px}}
@media(max-width:640px){body{font-size:15px}.lab{padding:8px 12px;gap:6px}.lab .spacer{display:none}.lab .explain{width:100%}.lab button{padding:4px 7px}.A{display:block}.sidebar{padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}.sidebar .brand{margin:0 0 16px}.sidebar nav{display:flex;gap:6px}.sidebar .nav-button{justify-content:center;width:auto;flex:1}.sidebar .group,.sidebar .foot,.sidebar .lists{display:none}.workspace{padding:26px 18px}.A .detail{padding:24px 20px}.heading{align-items:flex-start;flex-wrap:wrap;gap:8px}h1{font-size:30px}.B,.C{padding:18px 16px 150px}.B .topbar,.C .topbar{align-items:flex-start;flex-wrap:wrap;gap:15px}.B .notebook{margin:22px 0;padding:25px 18px}.B h1{font-size:32px}.B .quote{font-size:14px}.tabs{gap:3px}.tabs button{padding:7px 10px}.C .day-grid{display:flex;flex-direction:column;gap:20px}.C .timeline{padding:12px 16px}.C .untimed{order:-1}.C .heading{margin-top:25px}.switcher{bottom:12px}.switcher strong{font-size:13px}.entry{gap:3px}.task-meta{font-size:11px}.time{font-size:11px;padding-right:4px}.brand strong{font-size:23px}.detail h2{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<a class="skip" href="#main">跳到任务内容</a>
<div class="lab"><strong>体验原型 · 示例数据</strong><span class="explain">仅本次页面内有效，刷新会重置；离线与同步均为模拟。</span><span class="spacer"></span><button class="outline" id="network">模拟离线</button><button class="outline" id="reset">重置示例</button><button class="outline" id="reference">品牌参考</button></div>
<div id="root"></div>
<div class="toast" role="status" aria-live="polite" id="notice"></div>
<div class="switcher" aria-label="原型方案切换"><div class="row"><button id="prev" aria-label="上一个方案">←</button><strong id="variant-name"></strong><button id="next" aria-label="下一个方案">→</button></div><small id="variant-state"></small></div>
<dialog id="brand-dialog"><button id="close-reference" class="outline">关闭参考</button><h2>已确认的品牌概念</h2><p class="muted">沿用纸序名称与标志。当前界面为方向探索，生产 Logo、字号与配色规范仍待整理。</p><img src="../../assets/brand-concept.png" alt="纸序品牌概念板：纸页、叶形、环绕线条与暖色圆点，纸白与自然绿色方向"></dialog>
<script>
const names={A:'侧栏清单',B:'一日一页',C:'时间与待办'};
const descriptions={A:'快速浏览 · 详情并排',B:'单列阅读 · 详情在页内',C:'定时任务在时间轴 · 仅日期任务独立列出'};
const initial=[{id:1,title:'整理下周的课程安排',list:'学习',time:'',note:'核对课程时间，留出复习时间。',done:false},{id:2,title:'和小组讨论展示提纲',list:'学习',time:'10:00',note:'带上目前的提纲，确认每个人负责的部分。',done:false},{id:3,title:'完成产品调研笔记',list:'个人项目',time:'14:30',note:'整理今天的观察，把需要补证的地方单独列出。',done:false},{id:4,title:'买水果和早餐',list:'生活',time:'',note:'苹果、牛奶、全麦面包。',done:false},{id:5,title:'散步二十分钟',list:'生活',time:'18:00',note:'',done:false},{id:6,title:'给绿植浇水',list:'生活',time:'',note:'',done:true}];
let tasks=structuredClone(initial),selected=1,filter='今天',offline=false,pending=0,variant=new URLSearchParams(location.search).get('variant')||'A',counter=10,timer;
if(!names[variant])variant='A';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brand=()=>'<div class="brand"><span class="brand-icon" aria-hidden="true"></span><div><strong>纸序</strong><small>Paperdo</small></div></div>';
const status=()=>`<span class="status ${offline?'offline':''}"><span class="dot"></span>${offline?`离线 · ${pending?pending+' 项变更待同步':'可继续编辑'}`:'已同步'}</span>`;
const nav=()=>['今天','全部','已完成'].map(n=>`<button class="nav-button ${filter===n?'active':''}" data-filter="${n}" aria-pressed="${filter===n}">${n}<span class="count">${n==='已完成'?tasks.filter(t=>t.done).length:n==='全部'?tasks.length:tasks.filter(t=>!t.done).length}</span></button>`).join('');
const tabs=()=>`<nav class="tabs" aria-label="任务视图">${['今天','全部','已完成'].map(n=>`<button data-filter="${n}" class="${filter===n?'active':''}" aria-pressed="${filter===n}">${n}</button>`).join('')}</nav>`;
const heading=()=>`<div class="heading"><div><p class="date">2026 年 10 月 18 日 · 星期日</p><h1>${filter==='今天'?'把今天，轻轻安顿。':filter==='全部'?'每件事，都有位置。':'走过的一小步。'}</h1><span class="muted">${filter==='已完成'?'今天已完成 '+tasks.filter(t=>t.done).length+' 件事':'今天还有 '+tasks.filter(t=>!t.done).length+' 件待办'}</span></div>${status()}</div>`;
const entry=()=>'<form class="entry" id="add-form"><label for="new-task">添加今天的任务</label><input id="new-task" maxlength="160" placeholder="添加一件今天要做的事…" autocomplete="off" required><button class="primary" type="submit">＋ 添加</button></form>';
const row=t=>`<div class="task ${t.done?'done':''} ${selected===t.id?'selected':''}"><button class="check" data-done="${t.id}" aria-label="${t.done?'重新打开':'完成'}：${esc(t.title)}" aria-pressed="${t.done}"><span class="circle">${t.done?'✓':''}</span></button><button class="task-open" data-select="${t.id}" aria-label="查看详情：${esc(t.title)}"><span class="task-title">${esc(t.title)}</span><span class="task-meta"><span>${esc(t.list)}</span><span>${t.done?'已完成':'今天'}</span></span></button><span class="time">${esc(t.time)}</span></div>`;
const visible=()=>tasks.filter(t=>filter==='已完成'?t.done:filter==='今天'?!t.done:true);
const list=arr=>arr.length?arr.map(row).join(''):'<div class="empty">这里暂时没有任务。<br><small>留一点空间，也很好。</small></div>';
function detail(){const t=tasks.find(t=>t.id===selected);if(!t)return '<aside class="detail"><p class="muted">选择任务，查看详情。</p></aside>';return `<aside class="detail" aria-label="任务详情"><button class="close-detail outline" id="close-detail">收起详情</button><p class="eyebrow">任务详情</p><h2>${esc(t.title)}</h2><dl><dt>清单</dt><dd>${esc(t.list)}</dd><dt>日期</dt><dd>10 月 18 日${t.time?' · '+t.time:' · 仅日期'}</dd><dt>状态</dt><dd>${t.done?'已完成':'未完成'}</dd></dl><form id="note-form"><label for="task-note">备注</label><textarea id="task-note" maxlength="2000">${esc(t.note)}</textarea><button class="outline save" type="submit">保存备注</button></form><p class="hint">${offline?'当前离线，修改会计入待同步。':'每一步，都可以慢慢来。'}</p></aside>`}
function render(){const arr=visible();let html='';if(variant==='A')html=`<div class="app A"><aside class="sidebar">${brand()}<nav aria-label="任务视图">${nav()}</nav><div class="group">我的清单</div><div class="lists">${['学习','个人项目','生活'].map(n=>`<button class="nav-button ${filter===n?'active':''}" data-list="${n}">${n}</button>`).join('')}</div><p class="foot">一页一页，<br>把生活轻轻安顿。</p></aside><main id="main" class="workspace" tabindex="-1">${heading()}${entry()}<div class="list-heading"><span>${filter}</span><span>${arr.length} 件事</span></div>${list(arr)}</main>${detail()}</div>`;
if(variant==='B')html=`<div class="app B"><header class="topbar">${brand()}${tabs()}</header><main id="main" class="notebook" tabindex="-1">${heading()}<p class="quote">今天的事，写在今天这一页。</p>${entry()}<div class="list-heading"><span>${filter}</span><span>${arr.length} 件事</span></div>${list(arr)}${detail()}</main></div>`;
if(variant==='C'){const timed=arr.filter(t=>t.time).sort((a,b)=>a.time.localeCompare(b.time));html=`<div class="app C"><header class="topbar">${brand()}${tabs()}</header><main id="main" tabindex="-1">${heading()}<div class="day-grid"><section class="timeline"><h2>有时间的安排</h2>${timed.length?timed.map(t=>`<div class="slot"><div class="slot-time">${t.time}</div>${row(t)}</div>`).join(''):'<p class="empty">暂无定时任务。</p>'}<p class="hint">仅按已有时间排列，未自动分配时间。</p></section><section class="untimed"><h2>今天的待办</h2>${entry()}${list(arr.filter(t=>!t.time))}<p class="hint">仅日期任务，没有指定时刻。</p></section>${detail()}</div></main></div>`}
document.getElementById('root').innerHTML=html;document.getElementById('network').textContent=offline?'模拟恢复联网':'模拟离线';document.getElementById('variant-name').textContent=variant+' · '+names[variant];document.getElementById('variant-state').textContent=descriptions[variant]+' · 待办 '+tasks.filter(t=>!t.done).length+' · '+(offline?'离线 / 待同步 '+pending:'在线');bind();}
function message(s){clearTimeout(timer);document.getElementById('notice').textContent=s;timer=setTimeout(()=>document.getElementById('notice').textContent='',4500)}
function changed(){if(offline)pending++}
function bind(){document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-list]').forEach(b=>b.onclick=()=>{const first=tasks.find(t=>t.list===b.dataset.list&&!t.done);selected=first?.id??null;message('本轮只比较一天的任务；已定位此清单的示例任务。');render()});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=tasks.find(t=>t.id===Number(b.dataset.done));t.done=!t.done;changed();render();message((t.done?'已完成：':'已重新打开：')+t.title+(offline?' · 待同步':''))});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.select);render();if(variant==='B'||innerWidth<1100)document.querySelector('.detail').scrollIntoView({block:'nearest'})});document.getElementById('add-form')?.addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('new-task'),title=input.value.trim();if(!title){input.setCustomValidity('请输入任务名称');input.reportValidity();input.oninput=()=>input.setCustomValidity('');return}tasks.unshift({id:counter++,title,list:'生活',time:'',note:'',done:false});changed();filter='今天';render();document.getElementById('new-task').focus();message('已添加到今天'+(offline?' · 待同步':''))});document.getElementById('note-form')?.addEventListener('submit',e=>{e.preventDefault();tasks.find(t=>t.id===selected).note=document.getElementById('task-note').value;changed();render();message('备注已保存到本次演示'+(offline?' · 待同步':''))});document.getElementById('close-detail')?.addEventListener('click',()=>{selected=null;render()})}
function switchVariant(offset){const keys=Object.keys(names);variant=keys[(keys.indexOf(variant)+offset+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.getElementById('prev').onclick=()=>switchVariant(-1);document.getElementById('next').onclick=()=>switchVariant(1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable="true"],dialog')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowLeft'?-1:1)}});
document.getElementById('network').onclick=()=>{offline=!offline;if(!offline){const n=pending;pending=0;message('已模拟恢复联网'+(n?'，'+n+' 项变更已模拟同步':'')+'。没有连接真实服务。')}else message('已模拟离线，可以继续添加与完成任务。');render()};
document.getElementById('reset').onclick=()=>{tasks=structuredClone(initial);selected=1;pending=0;offline=false;filter='今天';render();message('示例已重置')};
document.getElementById('reference').onclick=()=>document.getElementById('brand-dialog').showModal();document.getElementById('close-reference').onclick=()=>document.getElementById('brand-dialog').close();render();
</script>
</html>
